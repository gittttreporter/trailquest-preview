<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <!--
    TrailQuest region map. Designers may move, add or remove nodes here; the
    app reads them at runtime (see SvgMapLayout). No Dart coordinates.
    data-node must match a mission id in lib/data/seed/missions_seed.dart.
    The `r` value is design metadata (the UI draws its own node chrome).
  -->
  <g id="nodes">
    <circle data-node="w_moss" cx="200" cy="780" r="46" />
    <circle data-node="w_stream" cx="420" cy="640" r="46" />
    <circle data-node="w_fern" cx="650" cy="720" r="48" />
    <circle data-node="w_owl" cx="880" cy="520" r="52" />
    <circle data-node="w_log" cx="1090" cy="620" r="46" />
    <circle data-node="w_quiz" cx="1300" cy="480" r="56" />
  </g>
</svg>
